name: SonarQube

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, coverage and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: scr/scrBackend/norafit

      - name: Ejecutar pruebas y generar coverage
        run: ./mvnw clean verify
        working-directory: scr/scrBackend/norafit

      - name: Verificar jacoco.xml
        run: |
          find . -name "jacoco.xml"
          test -f target/site/jacoco/jacoco.xml
        working-directory: scr/scrBackend/norafit

      - name: Analizar en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=puj-course \
            -Dsonar.projectKey=puj-course_FIS_2610_3517_G3 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        working-directory: scr/scrBackend/norafit
