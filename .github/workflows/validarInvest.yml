name: validarInvest

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  crear-issue:
    runs-on: ubuntu-latest

    steps:
      - name: Crear issue con formato HU
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FECHA=$(TZ=America/Bogota date +"%Y-%m-%d")

          gh issue create \
            --title "[Daily] $FECHA" \
            --label "daily" \
            --body "$(cat <<EOF
## Objetivo
Avanzar en la integración de los métodos de actualización en el sistema y comenzar el desarrollo del frontend en Flutter.

## Reunión
Durante la reunión se trabajó en la integración de los métodos updateWeight y updateRepetitions. Se inició el desarrollo del frontend en Flutter, implementando la pantalla de bienvenida con el logo de NoraFit y las opciones principales de acceso. Se revisó que la estructura visual fuera coherente con el diseño planteado en los mockups.

## Dudas
No hay dudas.
EOF
)"
