name: CI - Compilación del Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scr/scrBackend/norafit

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: scr/scrBackend/norafit/pom.xml

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Compilar proyecto
        run: ./mvnw clean compile
