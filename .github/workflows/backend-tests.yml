name: Backend Tests + SonarCloud

on:
  push:
    branches:
      - main
      - develop
      - feature/**
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x mvnw
        working-directory: scr/scrBackend/norafit

      - name: Ejecutar pruebas unitarias, coverage y validar mínimo 80%
        run: ./mvnw clean verify -Dtest='!*NorafitApplicationTests'
        working-directory: scr/scrBackend/norafit

      - name: Verificar reporte JaCoCo
        run: ls -la target/site/jacoco
        working-directory: scr/scrBackend/norafit

      - name: Analizar en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=TU_PROJECT_KEY \
            -Dsonar.organization=TU_ORGANIZATION \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        working-directory: scr/scrBackend/norafit
