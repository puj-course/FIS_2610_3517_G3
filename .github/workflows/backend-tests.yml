name: Tests Coverage SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage-sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: scr/scrBackend/norafit

      - name: Ejecutar pruebas unitarias y generar coverage
        run: ./mvnw clean test jacoco:report
        working-directory: scr/scrBackend/norafit

      - name: Verificar reporte JaCoCo XML
        run: |
          echo "Contenido del reporte JaCoCo:"
          ls -la target/site/jacoco
          test -f target/site/jacoco/jacoco.xml
        working-directory: scr/scrBackend/norafit

      - name: Mostrar exclusiones Sonar configuradas en pom.xml
        run: |
          echo "Exclusiones de coverage:"
          grep -A 12 "sonar.coverage.exclusions" pom.xml || true
          echo "Exclusiones de análisis:"
          grep -A 6 "sonar.exclusions" pom.xml || true
        working-directory: scr/scrBackend/norafit

      - name: Analizar en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=puj-course \
            -Dsonar.projectKey=puj-course_FIS_2610_3517_G3 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        working-directory: scr/scrBackend/norafit

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: scr/scrBackend/norafit/target/site/jacoco/
