name: SonarQube - Tests y Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, coverage and SonarQube analysis
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: scr/scrBackend/norafit

      - name: Ejecutar pruebas y generar coverage con JaCoCo
        run: ./mvnw clean verify
        working-directory: scr/scrBackend/norafit

      - name: Analizar en SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw sonar:sonar
        working-directory: scr/scrBackend/norafit

      - name: Publicar reporte JaCoCo como evidencia
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: scr/scrBackend/norafit/target/site/jacoco/
