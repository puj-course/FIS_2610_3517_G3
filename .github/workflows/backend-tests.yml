name: Tests Coverage SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage-sonar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: scr/scrBackend/norafit

      - name: Ejecutar pruebas unitarias y generar coverage
        run: ./mvnw clean test jacoco:report -Dtest='!*NorafitApplicationTests'
        working-directory: scr/scrBackend/norafit

      - name: Verificar reporte JaCoCo
        run: ls -la target/site/jacoco
        working-directory: scr/scrBackend/norafit

      - name: Analizar en SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar -Dsonar.host.url=https://sonarcloud.io
        working-directory: scr/scrBackend/norafit

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: scr/scrBackend/norafit/target/site/jacoco/
