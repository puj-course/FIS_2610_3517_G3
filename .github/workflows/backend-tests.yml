name: CI - Pruebas Unitarias y Cobertura

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permisos al Maven Wrapper
        run: chmod +x ./mvnw
        working-directory: scr/scrBackend/norafit

      - name: Ejecutar pruebas unitarias y generar reporte JaCoCo
        run: ./mvnw clean test org.jacoco:jacoco-maven-plugin:0.8.11:report
        working-directory: scr/scrBackend/norafit

      - name: Publicar reporte JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-jacoco
          path: scr/scrBackend/norafit/target/site/jacoco/
