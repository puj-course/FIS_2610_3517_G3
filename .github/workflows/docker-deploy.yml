name: Docker Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permisos a Maven Wrapper
        run: chmod +x scr/scrBackend/norafit/mvnw

      - name: Compilar proyecto
        run: cd scr/scrBackend/norafit && ./mvnw clean package

      - name: Verificar archivos target
        run: ls -la scr/scrBackend/norafit/target

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: scr/scrBackend/norafit
          file: scr/scrBackend/norafit/Dockerfile
          push: true
          tags: |
            juanmendozamarquez/norafit-app:latest
            juanmendozamarquez/norafit-app:${{ github.sha }}
      - name: Notificar en Telegram
        if: always()
        run: |
          STATUS="✅ Exitoso"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="❌ Fallido"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🏋️ *NoraFit CI/CD*
          Estado: $STATUS
          Rama: ${{ github.ref_name }}
          Commit: ${{ github.sha }}
          Por: ${{ github.actor }}" \
            -d parse_mode="Markdown"
