name: Docker Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permisos a Maven Wrapper
        run: chmod +x scr/scrBackend/norafit/mvnw

      - name: Compilar proyecto
        run: cd scr/scrBackend/norafit && ./mvnw clean package -DskipTests

      - name: Verificar archivos target
        run: ls -la scr/scrBackend/norafit/target

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v5
        with:
          context: scr/scrBackend/norafit
          file: scr/scrBackend/norafit/Dockerfile
          push: true
          tags: juanmendozamarquez/norafit-app:latest
