name: Docker Deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permisos a Maven Wrapper
        run: chmod +x scr/scrBackend/norafit/mvnw

      - name: Compilar proyecto
        run: cd scr/scrBackend/norafit && ./mvnw clean package -DskipTests

      - name: Verificar archivos target
        run: ls -la scr/scrBackend/norafit/target

      - name: Construir imagen Docker
        run: docker build -f scr/scrBackend/norafit/Dockerfile -t norafit-app scr/scrBackend/norafit

      - name: Ejecutar contenedor de prueba
        run: |
          docker run -d --name norafit-test -p 8080:8080 norafit-app
          sleep 30
          docker logs norafit-test
          docker stop norafit-test
