name: Pipeline Empaquetado

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  empaquetar:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scr/scrBackend/norafit

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: scr/scrBackend/norafit/pom.xml

      - name: Dar permisos al wrapper de Maven
        run: chmod +x mvnw

      - name: Empaquetar proyecto
        run: ./mvnw clean package -DskipTests

      - name: Verificar archivos generados
        run: ls -lah target

      - name: Verificar que exista un JAR ejecutable
        run: |
          JAR_FILE=$(find target -maxdepth 1 -name "*.jar" ! -name "*original*.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "No se encontró un archivo .jar ejecutable en target"
            exit 1
          fi
          echo "JAR encontrado: $JAR_FILE"

      - name: Subir artefacto generado
        uses: actions/upload-artifact@v4
        with:
          name: norafit-jar
          path: scr/scrBackend/norafit/target/*.jar
          if-no-files-found: error
